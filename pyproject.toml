[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff >=0.9 formats fenced Python code blocks inside Markdown by default. The
# `~=0.8` pin (CLAUDE.md §2.3) is a two-segment compatible-release specifier, which
# under PEP 440 only fixes the major version (resolves to any 0.x release, not 0.8.x),
# so newer ruff versions are installed. Excluding docs keeps ruff scoped to Python
# source, which is its only intended target in this project.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]  # formatter owns line length

[tool.ruff.lint.per-file-ignores]
# IMPLEMENTATION_PLAN.md Phase 1 names this function POWER_CURVE_EXPECTED_KW to read as
# the module's other named curve/constant, POWER_CURVE (PROJECT_SPEC.md §6.2). N802
# (function names must be lowercase) is disabled for config.py alone rather than inline
# per-call, per CLAUDE.md §3.3's "change pyproject.toml and say so" escape hatch.
"config.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["src.domain.*", "src.data.*"]
strict = true

[[tool.mypy.overrides]]
# `scipy` (pinned ~=1.14 in requirements.txt, used by src/ui/charts.py for OLS regression,
# PROJECT_SPEC.md §2) ships no `py.typed` marker in this pin and CLAUDE.md §2.3 does not list
# a `scipy-stubs` dev dependency, so it is treated the same as the other untyped third-party
# UI dependencies already listed here (CLAUDE.md §3.3 escape hatch).
module = ["folium.*", "streamlit_folium.*", "branca.*", "timezonefinder.*", "plotly.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
